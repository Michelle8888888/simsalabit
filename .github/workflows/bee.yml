name: Make the bee model small
on:
  push:
    branches: [bee-opt]
    paths: ['.github/workflows/bee.yml']
permissions:
  contents: write
jobs:
  bee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the original bee
        run: curl -fsSL -o /tmp/bee-original.glb "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261017_132918_e8364d8f-7df2-4788-a725-dec28ec19af8.glb"
      - name: Small variants for fast loading
        run: |
          npx -y @gltf-transform/cli@4 optimize /tmp/bee-original.glb assets/bee-s768.glb --compress meshopt --texture-compress webp --texture-size 768 --simplify true --simplify-ratio 0.3 --simplify-error 0.004
          npx -y @gltf-transform/cli@4 optimize /tmp/bee-original.glb assets/bee-s512.glb --compress meshopt --texture-compress webp --texture-size 512 --simplify true --simplify-ratio 0.25 --simplify-error 0.006
          for f in assets/bee-s768.glb assets/bee-s512.glb; do npx -y @gltf-transform/cli@4 inspect $f > bee-report/$(basename $f .glb).txt 2>&1 || true; done
          ls -la assets/*.glb
      - name: Save it in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets bee-report
          git commit -m "Small bee variants"
          git push
